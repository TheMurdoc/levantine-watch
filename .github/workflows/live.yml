name: Live data

# Collects aircraft / AIS / GNSS / headlines and redeploys the site to GitHub Pages.
# Pages must be set to: Settings -> Pages -> Source: GitHub Actions
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (GitHub may start scheduled runs late)
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]          # redeploy immediately when you push page changes

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt

      - name: Collect live data
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          AIS_LISTEN_SECONDS: "90"
          GNSS_WINDOW_HOURS: "6"
        run: python collector/collect.py --out _site/data

      - name: Assemble site
        run: cp index.html README.md _site/ && touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
